name: MERYO isolated push dispatch
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  push:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Official native pg_net and pg_cron, no Docker
        timeout-minutes: 7
        run: |
          # The runner's Azure mirror stalled while downloading LLVM. Use the
          # official Ubuntu archive, still with bounded connection/retry limits.
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo grep -rl 'azure.archive.ubuntu.com' /etc/apt | xargs -r sudo sed -i -E 's|https?://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g'
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=2 -o Acquire::http::Timeout=30 postgresql-17 postgresql-17-cron libcurl4-openssl-dev build-essential
          # Official PGDG development headers/PGXS only. GCC is already present;
          # this C extension does not need the large optional LLVM toolchain.
          mkdir -p "$RUNNER_TEMP/pg17-headers"
          cd "$RUNNER_TEMP/pg17-headers"
          apt-get download postgresql-server-dev-17
          sudo dpkg-deb --extract postgresql-server-dev-17*.deb /
          git clone --filter=blob:none --no-checkout https://github.com/supabase/pg_net.git "$RUNNER_TEMP/pg_net"
          git -C "$RUNNER_TEMP/pg_net" checkout 8d7bb9efd0484331f7aff19aee2a3cd64ca5f886
          make -C "$RUNNER_TEMP/pg_net" PG_CONFIG=/usr/lib/postgresql/17/bin/pg_config with_llvm=no
          sudo make -C "$RUNNER_TEMP/pg_net" PG_CONFIG=/usr/lib/postgresql/17/bin/pg_config with_llvm=no install
          sudo pg_createcluster 17 meryo_push --port 55440
          printf "%s\n" "shared_preload_libraries='pg_net,pg_cron'" "cron.database_name='postgres'" "cron.use_background_workers=on" "pg_net.database_name='postgres'" | sudo tee -a /etc/postgresql/17/meryo_push/postgresql.conf
          sudo pg_ctlcluster 17 meryo_push start
          sudo -u postgres createuser --host=/var/run/postgresql --port=55440 --superuser "$USER"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify actual post-commit HTTP wake, cron retry and client isolation
        run: node scripts/verify-push-dispatch-ci.mjs
