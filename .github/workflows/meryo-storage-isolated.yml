name: MERYO isolated Storage verification
on:
  workflow_dispatch:
    inputs:
      scope:
        description: "Prueba acotada o batería completa existente"
        type: choice
        options:
          - full
          - inspiration
        default: full
permissions:
  contents: read
concurrency:
  group: meryo-isolated-storage
  cancel-in-progress: false
jobs:
  storage:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - name: Install native PostgreSQL 17 and synthetic media tools
        timeout-minutes: 8
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=2 -o Acquire::http::Timeout=30 postgresql-17 postgresql-contrib-17 postgresql-17-cron ffmpeg
          sudo pg_createcluster 17 meryo_storage --port 55440
          printf "%s\n" "shared_preload_libraries='pg_cron'" "cron.database_name='meryo_ci_storage'" "cron.use_background_workers=on" | sudo tee -a /etc/postgresql/17/meryo_storage/postgresql.conf
          sudo pg_ctlcluster 17 meryo_storage start
          sudo -u postgres createuser --host=/var/run/postgresql --port=55440 --superuser "$USER"
          createdb --host=/var/run/postgresql --port=55440 meryo_ci_storage
      - name: Install MERYO dependencies
        run: npm ci
      - name: Validate isolated SQL bootstrap before compiling services
        env:
          MERYO_CI_SETUP_ONLY: 'true'
          MERYO_CI_INSPIRATION_ONLY: ${{ inputs.scope == 'inspiration' && 'true' || 'false' }}
        run: node scripts/verify-storage-ci.mjs
      - name: Compile pinned official Supabase services, without Docker
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/meryo-official"
          git clone --filter=blob:none --no-checkout https://github.com/supabase/auth.git "$RUNNER_TEMP/meryo-official/auth"
          git -C "$RUNNER_TEMP/meryo-official/auth" checkout c3348e8f1cb31454e9783e4eb9eab1e71ad9652f
          cd "$RUNNER_TEMP/meryo-official/auth"
          go build -o "$RUNNER_TEMP/meryo-official/gotrue" .
          git clone --filter=blob:none --no-checkout https://github.com/supabase/storage.git "$RUNNER_TEMP/meryo-official/storage"
          git -C "$RUNNER_TEMP/meryo-official/storage" checkout 3a88e1f74b7082d83a456449806a222e3e6c3bfa
          cd "$RUNNER_TEMP/meryo-official/storage"
          npm ci
          npm run build
          asset_id="$(gh api repos/PostgREST/postgrest/releases/tags/v16.5 --jq '.assets[] | select(.name == "postgrest-v16.5-linux-static-x86-64.tar.xz") | .id')"
          test -n "$asset_id"
          gh api -H 'Accept: application/octet-stream' "repos/PostgREST/postgrest/releases/assets/$asset_id" > "$RUNNER_TEMP/meryo-official/rest.tar.xz"
          test -s "$RUNNER_TEMP/meryo-official/rest.tar.xz"
          tar -xJf "$RUNNER_TEMP/meryo-official/rest.tar.xz" -C "$RUNNER_TEMP/meryo-official"
      - name: Verify real Storage upload, read, replacement, withdrawal and tenant permissions
        env:
          MERYO_CI_INSPIRATION_ONLY: ${{ inputs.scope == 'inspiration' && 'true' || 'false' }}
        run: node scripts/verify-storage-ci.mjs
      - name: Publish non-secret verification result
        if: success()
        run: cat "$RUNNER_TEMP/meryo-storage-proof.json" >> "$GITHUB_STEP_SUMMARY"
